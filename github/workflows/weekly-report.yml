name: Weekly Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.REPORT_GITHUB_TOKEN || github.token }}
        run: node ./src/index.js --config config.example.json

      - name: Commit report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update weekly report"
          file_pattern: weekly-report.md
